name: "Deploy Wonderwall for App"
run-name: "Deploy Wonderwall"

on:
  workflow_dispatch:
    inputs:
      app-name:
        description: 'Wonderwall prod, preprod eller dev?'
        required: true
        default: 'dev'
        type: choice
        options:
          - 'dev'
          - 'preprod'
          - 'prod'

jobs:
  deploy-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: "Set cluster based on env"
        run: |
          APP="${{ github.event.inputs.app-name }}"
          if [ "$APP" = "prod" ]; then
            echo "CLUSTER=prod-gcp" >> $GITHUB_ENV
          else
            echo "CLUSTER=dev-gcp" >> $GITHUB_ENV
          fi

      - name: "Deploy ${{ github.event.inputs.app-name }} to ${{ env.CLUSTER }}"
        uses: nais/deploy/actions/deploy@v3
        env:
          APIKEY: ${{ secrets.NAIS_DEPLOY_APIKEY }}
          RESOURCE: wonderwall/${{ github.event.inputs.app-name }}/wonderwall.yml
          CLUSTER: ${{ env.CLUSTER }}
          REF: ${{ github.sha }}
          PRINT_PAYLOAD: true
